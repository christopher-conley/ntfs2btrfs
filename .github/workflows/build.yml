name: build x86_64-pc-linux-gnu
on:
  workflow_dispatch:

jobs:
  x86_64-pc-linux-gnu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set env vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install prerequisites
        run: |
          apt-get update -y \
            && apt-get upgrade -y \
            && apt-get install -y g++ git cmake nodejs pkg-config libfmt-dev liblzo2-dev libzstd-dev zlib1g-dev

      - name: Build and install
        run: |
          cd ${{ github.workspace }} \
            && mkdir -p debug-work \
            && mkdir -p release-work \
            && cmake -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install/debug \
            -DCMAKE_INSTALL_INCLUDEDIR=../include \
            -DWITH_OPENSSL=ON -DENABLE_KRB5=ON \
            -S ${SHORT_SHA} -B debug-work
            && cmake --build debug-work --parallel `nproc`
            && cmake --install debug-work \
            && cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install \
            -DWITH_OPENSSL=ON -DENABLE_KRB5=ON \
            -S ${SHORT_SHA} -B release-work
            && cmake --build release-work --parallel `nproc`
            && cmake --install release-work

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ github.sha }}
          overwrite: true
          path: |
            install
